<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comedor Universitario · Sistema de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="login">
  <div class="login-box">
    <h1>Comedor<br>Universitario</h1>
    <p>Elige cómo quieres entrar. Es una demo: aún no hay contraseña.</p>
    <button data-a="rol" data-id="cliente">Soy estudiante</button>
    <button data-a="rol" data-id="cocina">Soy de cocina</button>
    <button data-a="rol" data-id="admin">Soy administrador</button>
  </div>
</main>
<div id="app" hidden>
  <aside>
    <h2>Comedor U</h2>
    <nav id="nav"></nav>
    <p id="quien"></p>
    <button class="ghost" data-a="salir">Cerrar sesión</button>
  </aside>
  <section id="view"></section>
</div>
<dialog id="dlg"><form id="frm"></form></dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
