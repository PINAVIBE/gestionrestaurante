<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comedor Universitario · Sistema de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="login" hidden>
  <div class="login-box">
    <h1>Comedor<br>Universitario</h1>
    <form id="fLogin">
      <label>Correo<input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button>Ingresar</button>
    </form>
    <form id="fReg" hidden>
      <label>Nombre completo<input name="nombre" autocomplete="name" maxlength="80" required></label>
      <label>Correo<input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña (mínimo 8 caracteres)<input name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></label>
      <button>Crear cuenta de estudiante</button>
    </form>
    <p id="loginErr" role="alert"></p>
    <button type="button" class="link" id="alt">¿No tienes cuenta? Regístrate</button>
  </div>
</main>
<div id="app" hidden>
  <aside>
    <h2>Comedor U</h2>
    <nav id="nav"></nav>
    <p id="quien"></p>
    <button class="ghost" data-a="salir">Cerrar sesión</button>
  </aside>
  <section id="view"></section>
</div>
<dialog id="dlg"><form id="frm"></form></dialog>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
